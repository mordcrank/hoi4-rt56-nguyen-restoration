l_english:
 # --- focuses ---
 VIN_the_nguyen_restoration:0 "The Nguyen Restoration"
 VIN_the_nguyen_restoration_desc:0 "The war is won and the throne of Hue is ours again. Emperor Bao Dai returns to a country that must now decide what kind of empire it wants to be."
 VIN_the_mandate_of_heaven:0 "The Mandate of Heaven"
 VIN_the_mandate_of_heaven_desc:0 "The dynasty rules because heaven allows it. We must show the people that it still does."
 VIN_the_imperial_guard:0 "The Imperial Guard"
 VIN_the_imperial_guard_desc:0 "The court needs soldiers who answer to the throne and to nobody else."
 VIN_the_emperor_stands_alone:0 "The Emperor Stands Alone"
 VIN_the_emperor_stands_alone_desc:0 "Vietnam has been a pawn of foreign powers for too long. The emperor will bow to no one."
 VIN_envoys_to_nanjing:0 "Envoys to Nanjing"
 VIN_envoys_to_nanjing_desc:0 "Two authoritarian governments facing the same neighbours have reasons to stand together. Let us send envoys to Chiang Kai-shek."
 VIN_the_lao_question:0 "The Lao Question"
 VIN_the_lao_question_desc:0 "The Lao lands were once tied to Hue. The new Laos is weak and its borders are open to argument."
 VIN_the_khmer_question:0 "The Khmer Question"
 VIN_the_khmer_question_desc:0 "Cambodia has always lived between Vietnam and Siam. It is time to decide which of them it will answer to."
 VIN_heirs_of_gia_long:0 "Heirs of Gia Long"
 VIN_heirs_of_gia_long_desc:0 "Gia Long united the country from Hanoi to the Mekong. Our empire will do the same again."
 # --- ideas ---
 VIN_mandate_of_heaven:0 "Mandate of Heaven"
 VIN_imperial_guard:0 "The Imperial Guard"
 VIN_imperial_independence:0 "Imperial Independence"
# --- decisions ---
 recall_bao_dai_from_hong_kong:0 "Recall Bao Dai from Hong Kong"
 recall_bao_dai_from_hong_kong_desc:0 "The former emperor lives in exile. His return would give the war a face and a name."
 rally_the_mandarins_of_hue:0 "Rally the Mandarins of Hue"
 rally_the_mandarins_of_hue_desc:0 "The old court officials still know how to run the country. Many would come back for the right promise."
 fund_the_imperial_loyalists:0 "Fund the Imperial Loyalists"
 fund_the_imperial_loyalists_desc:0 "Loyalist groups across Annam and Tonkin need money and weapons to stand against the other factions."
 nguyen_gain_influence_tt:0 "The §YNguyen Court§! gains influence."
 # --- events ---
 vietnam.16.t:0 "The Emperor Returns"
 vietnam.16.d:0 "The war is over and Bao Dai has taken the throne. The monarchists around him won the struggle for power, and the Nguyen dynasty rules again.\n\nFrench Indochina has ceased to exist and every remaining colonial territory now belongs to the empire."
 vietnam.16.a:0 "Long live the Emperor!"
 vietnam.17.t:0 "Envoys from Hue"
 vietnam.17.d:0 "Emperor Bao Dai has sent envoys to ask for an alliance. As a sign of good faith, they offer to hand over the port of Guangzhouwan, which has long been seen as Chinese territory."
 vietnam.17.a:0 "Accept the offer and welcome them"
 vietnam.17.b:0 "We want no part in their affairs"
 # --- cosmetic tag ---
 VINNguyen:0 "Empire of Vietnam"
 VINNguyen_DEF:0 "the Empire of Vietnam"
 VINNguyen_ADJ:0 "Vietnamese"
