l_english:
 VIN_the_nguyen_restoration:0 "The Nguyen Restoration"
 VIN_the_nguyen_restoration_desc:0 "The war is won and the throne of Hue is ours again. Emperor Bao Dai returns to a country that must now decide what kind of empire it wants to be."
 VIN_the_mandate_of_heaven:0 "The Mandate of Heaven"
 VIN_the_mandate_of_heaven_desc:0 "The dynasty rules because heaven allows it. We must show the people that it still does."
 VIN_the_court_of_hue:0 "The Court of Hue"
 VIN_the_court_of_hue_desc:0 "The old court at Hue must be rebuilt, with its ranks, its rituals and its loyal servants."
 VIN_the_village_councils:0 "The Village Councils"
 VIN_the_village_councils_desc:0 "The villages have always governed themselves under the emperor's name. Let us give that tradition real authority."
 VIN_the_imperial_guard:0 "The Imperial Guard"
 VIN_the_imperial_guard_desc:0 "The court needs soldiers who answer to the throne and to nobody else."
 VIN_the_mandarin_examinations:0 "The Mandarin Examinations"
 VIN_the_mandarin_examinations_desc:0 "Merit, not birth, has always opened the way to office. The old examinations will choose a new generation of officials and scholars."
 VIN_the_imperial_land_reform:0 "The Imperial Land Reform"
 VIN_the_imperial_land_reform_desc:0 "The land belongs to those who farm it. The emperor will see that the peasants are no longer at the mercy of landlords."
 VIN_the_imperial_military_academy:0 "The Imperial Military Academy"
 VIN_the_imperial_military_academy_desc:0 "Officers loyal to the dynasty will be trained in a modern academy, with foreign instructors where needed."
 VIN_the_golden_age:0 "The Golden Age"
 VIN_the_golden_age_desc:0 "The court is rebuilt, the villages are content and the army is loyal. Vietnam is ready for a new golden age."
 VIN_envoys_to_nanjing:0 "Envoys to Nanjing"
 VIN_envoys_to_nanjing_desc:0 "Two authoritarian governments facing the same neighbours have reasons to stand together. Let us send envoys to Chiang Kai-shek."
 VIN_the_emperor_stands_alone:0 "The Emperor Stands Alone"
 VIN_the_emperor_stands_alone_desc:0 "Vietnam has been a pawn of foreign powers for too long. The emperor will bow to no one."
 VIN_chinese_military_advisors:0 "Chinese Military Advisors"
 VIN_chinese_military_advisors_desc:0 "Our new friends in China are willing to send officers and instructors to modernise our army."
 VIN_the_border_fortresses:0 "The Border Fortresses"
 VIN_the_border_fortresses_desc:0 "If nobody will help us, we will build walls that nobody can break. Fortresses along every border will guard the empire."
 VIN_the_lao_question:0 "The Lao Question"
 VIN_the_lao_question_desc:0 "The Lao lands were once tied to Hue. The new Laos is weak and its borders are open to argument."
 VIN_the_khmer_question:0 "The Khmer Question"
 VIN_the_khmer_question_desc:0 "Cambodia has always lived between Vietnam and Siam. It is time to decide which of them it will answer to."
 VIN_heirs_of_gia_long:0 "Heirs of Gia Long"
 VIN_heirs_of_gia_long_desc:0 "Gia Long united the country from Hanoi to the Mekong. Our empire will do the same again."
