 # --- decisions ---
 recall_bao_dai_from_hong_kong:0 "Recall Bao Dai from Hong Kong"
 recall_bao_dai_from_hong_kong_desc:0 "The former emperor lives in exile. His return would give the war a face and a name."
 rally_the_mandarins_of_hue:0 "Rally the Mandarins of Hue"
 rally_the_mandarins_of_hue_desc:0 "The old court officials still know how to run the country. Many would come back for the right promise."
 fund_the_imperial_loyalists:0 "Fund the Imperial Loyalists"
 fund_the_imperial_loyalists_desc:0 "Loyalist groups across Annam and Tonkin need money and weapons to stand against the other factions."
 nguyen_gain_influence_tt:0 "The §YNguyen Court§! gains influence."
 # --- events ---
 vietnam.16.t:0 "The Emperor Returns"
 vietnam.16.d:0 "The war is over and Bao Dai has taken the throne. The monarchists around him won the struggle for power, and the Nguyen dynasty rules again.\n\nFrench Indochina has ceased to exist and every remaining colonial territory now belongs to the empire."
 vietnam.16.a:0 "Long live the Emperor!"
 vietnam.17.t:0 "Envoys from Hue"
 vietnam.17.d:0 "Emperor Bao Dai has sent envoys to ask for an alliance. As a sign of good faith, they offer to hand over the port of Guangzhouwan, which has long been seen as Chinese territory."
 vietnam.17.a:0 "Accept the offer and welcome them"
 vietnam.17.b:0 "We must maintain our geopolitical neutrality. Deny the alliance but respect their borders."
 # --- cosmetic tag ---
 VINNguyen:0 "Empire of Dai Nam"
 VINNguyen_DEF:0 "the Empire of Dai Nam"
 VINNguyen_ADJ:0 "Vietnamese"
 # --- hidden refusal ---
 vietnam.18.t:0 "Secret Report from Nanjing"
 vietnam.18.d:0 "Our diplomatic envoys have returned from the Chinese capital with an unbelievable secret report regarding why our alliance proposal failed.\n\nAccording to an aggregate of insider leaks from the Presidential Palace, Generalissimo Chiang Kai-shek could not find his favorite military socks that morning, his uniform was completely wrinkled, and he was in an absolute rage. Our diplomats unfortunately walked into his office at the worst possible moment. Too furious to look at a treaty, he ordered his guards to throw our delegation out of the room. It seems the fate of East Asian geopolitics was decided by a laundry disaster."
 vietnam.18.a:0 "You have got to be kidding me..."
 CHI_refused_alliance:0 "Snubbed by Chiang Kai-shek"
 CHI_snubbed_by_socks:0 "Snubbed due to Missing Socks"
 # --- Dragon-Tiger Pact news ---
 vietnam.19.t:0 "The Dragon-Tiger Pact"
 vietnam.19.d:0 "In a ceremony attended by envoys of both governments, Emperor Bao Dai and Generalissimo Chiang Kai-shek have signed a pact of friendship and mutual support between Hue and Nanjing.\n\nChina has pledged to stand by the new Vietnamese state and the port of Guangzhouwan has returned to Chinese hands. Observers say that the Dragon of Hue and the Tiger of Nanjing now face the powers of the region together."
 vietnam.19.a:0 "A new friendship in Asia."
 # --- military help ---
 VIN_imperial_zeal:0 "Imperial Zeal"
 VIN_imperial_zeal_desc:0 "The return of the emperor has stirred loyalist soldiers across Annam. They fight harder for the throne, especially in the jungle."
 nguyen_imperial_guard_tt:0 "The new §YImperial Loyalists§! division template becomes available and three divisions appear in §YHue§!."
 VIN_china_has_answered_tt:0 "China has answered our request"
 nguyen_chinese_arms_tt:0 "China sends §Y2000§! pieces of infantry equipment to our stockpile as a gift."
 # --- v0.3 focuses ---
 VIN_the_imperial_literacy_campaign:0 "The Imperial Literacy Campaign"
 VIN_the_imperial_literacy_campaign_desc:0 "The court will open schools in every district and send scholars to the villages. Reading will no longer be a privilege of the mandarins."
 VIN_imperial_affairs:0 "Imperial Affairs"
 VIN_imperial_affairs_desc:0 "The throne must decide how the empire will deal with its neighbours. A council of generals and officials begins to plan."
 VIN_fortify_hue:0 "Fortify Hue"
 VIN_fortify_hue_desc:0 "The imperial capital cannot fall. Forts and coastal batteries will protect Hue from land and sea."
 VIN_imperial_army_reform:0 "Imperial Army Reform"
 VIN_imperial_army_reform_desc:0 "The army will be reorganised, with better training and a loyal officer corps."
 VIN_campaign_planning:0 "Campaign Planning"
 VIN_campaign_planning_desc:0 "Staff officers prepare detailed plans for the campaigns that will follow."
 VIN_betray_nanjing:0 "Betray Nanjing"
 VIN_betray_nanjing_desc:0 "China guaranteed our independence, but it is also the neighbour with the most to lose from a strong Vietnam. Strike while Nanjing trusts us."
 VIN_continue_the_cooperation:0 "Continue the Cooperation"
 VIN_continue_the_cooperation_desc:0 "The friendship with China has served us well. We will keep our hand extended to Nanjing."
 VIN_war_on_the_tiger:0 "War on the Tiger"
 VIN_war_on_the_tiger_desc:0 "Vietnam has always had to defend itself from China. This time the dragon will go on the attack."
 # --- v0.3 ideas ---
