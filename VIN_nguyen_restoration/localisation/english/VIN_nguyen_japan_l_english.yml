l_english:
 VIN_the_unthinkable_alliance:0 "The Unthinkable Alliance"
 VIN_the_unthinkable_alliance_desc:0 "In 1945 it was Tokyo that let Bao Dai proclaim an independent empire. Now Japan marches against China again, and an old patron could become a new ally. Many at court call it unthinkable. The emperor calls it necessary."
 VIN_partition_of_the_south:0 "Partition of the South"
 VIN_partition_of_the_south_desc:0 "When China falls, its southern provinces must not go to Tokyo alone. The empire will claim its share of the border lands."
 VIN_unthinkable_alliance_tt:0 "§YJapan§! receives our offer to join the §YCo-Prosperity Sphere§!."
 VIN_japan_accepted_alliance_tt:0 "Japan has accepted our alliance"
 VIN_partition_of_the_south_tt:0 "We gain §Yclaims§! on every §YChinese§! state bordering our empire and on §YHainan§!."
 vin_nguyen.1.t:0 "Envoys from Hue"
 vin_nguyen.1.d:0 "Emperor Bao Dai has sent envoys to Tokyo. In 1945 our army allowed him to declare independence from France, and now he offers to fight beside us against China.\n\nSome officers remember that we once favoured Prince Cuong De for the throne of Vietnam. Others point out that a friendly empire on China's southern border would be very useful."
 vin_nguyen.1.a:0 "Welcome the Emperor into the Sphere."
 vin_nguyen.1.b:0 "We have no need of Bao Dai."
 vin_nguyen.2.t:0 "Tokyo Accepts"
 vin_nguyen.2.d:0 "Japan has accepted our offer. The empire now stands beside Tokyo, and Japanese ships are already bringing rifles and ammunition to Haiphong.\n\nAt court, few dare to say aloud what everyone is thinking: the last time Japan helped us, the price was high."
 vin_nguyen.2.a:0 "The Dragon and the Rising Sun."
 vin_nguyen.3.t:0 "Tokyo's Second Choice"
 vin_nguyen.3.d:0 "Our envoys have returned from Tokyo with nothing. The Japanese were polite, but it became clear that many in their government still remember Prince Cuong De, who lived in exile in Japan for decades, as the man they wanted on our throne.\n\nThe humiliation is felt at court, but the emperor has turned it into a lesson: Vietnam will rely on itself."
 vin_nguyen.3.a:0 "So be it."
 vin_nguyen.4.t:0 "The Unthinkable Alliance"
 vin_nguyen.4.d:0 "Few would have believed it a year ago. Emperor Bao Dai of Vietnam has joined the alliance led by Japan, the same power that sponsored his short-lived empire in 1945.\n\nVietnamese troops are expected to press China from the south while Japanese armies advance from the north and the sea."
 vin_nguyen.4.a:0 "History repeats itself."
